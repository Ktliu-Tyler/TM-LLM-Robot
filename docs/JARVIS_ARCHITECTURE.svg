<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2200" viewBox="0 0 1600 1100"><rect width="1600" height="1100" fill="#102333"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#8acbc9"/></marker></defs><text x="50" y="65" fill="#e9f5f5" font-family="Arial,sans-serif" font-size="42">Jarvis / Workbench — Current Implementation</text><text x="50" y="105" fill="#a6c4cc" font-family="Arial,sans-serif" font-size="24">Voice conversation + inventory tools + movement dispatch | 2026-11-17</text><rect x="50" y="160" width="430" height="140" rx="14" fill="#194b59" stroke="#527987"/><text x="70" y="196" fill="#e9f5f5" font-family="Arial,sans-serif" font-size="27">Control Room :8765</text><text x="70" y="230" fill="#bdd9df" font-family="Arial,sans-serif" font-size="20">admin / embedded chat :8767</text><text x="70" y="257" fill="#bdd9df" font-family="Arial,sans-serif" font-size="20">Node switching, results, API trace</text><text x="70" y="284" fill="#bdd9df" font-family="Arial,sans-serif" font-size="20">Old and new agents are exclusive</text><rect x="1110" y="160" width="440" height="140" rx="14" fill="#344553" stroke="#527987"/><text x="1130" y="196" fill="#e9f5f5" font-family="Arial,sans-serif" font-size="27">Legacy workbench_agent</text><text x="1130" y="230" fill="#bdd9df" font-family="Arial,sans-serif" font-size="20">Kept available in the control room</text><text x="1130" y="257" fill="#bdd9df" font-family="Arial,sans-serif" font-size="20">Same Inventory / arm interfaces</text><text x="1130" y="284" fill="#bdd9df" font-family="Arial,sans-serif" font-size="20">Runs only when Jarvis is stopped</text><rect x="50" y="390" width="430" height="140" rx="14" fill="#194b59" stroke="#527987"/><text x="70" y="426" fill="#e9f5f5" font-family="Arial,sans-serif" font-size="27">Voice Worker</text><text x="70" y="460" fill="#bdd9df" font-family="Arial,sans-serif" font-size="20