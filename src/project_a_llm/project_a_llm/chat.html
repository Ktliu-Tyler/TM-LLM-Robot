<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench · 對話觀測台</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c1422;color:#e6edf7}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;border-bottom:1px solid #29364d;display:flex;justify-content:space-between;gap:16px}h1{font-size:23px;margin:0}small,.muted{color:#9aabc3}main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px;max-width:1700px;margin:auto}.panel{background:#131f31;border:1px solid #2b3b52;border-radius:14px;padding:18px;min-width:0}h2{font-size:16px;margin-top:0}button,input,textarea,select{font:inherit;color:inherit;background:#1d2d44;border:1px solid #405471;border-radius:8px;padding:10px}button{cursor:pointer}button.primary{background:#166a66}button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#messages{height:52vh;overflow:auto;padding:12px 0}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid #438aaf;padding:12px;margin:10px 0;background:#18273c}.user{border-color:#57d4ba}.error{color:#ffb2a8}textarea{width:100%;resize:vertical;margin:10px 0}.badge{background:#233b53;border-radius:20px;padding:7px 14px}#events{height:65vh;overflow:auto}details{border-bottom:1px solid #2b3b52;padding:10px 0}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#b8d4ed}#thinking{max-height:200px;overflow:auto}.help{font-size:12px;line-height:1.6}@media(max-width:850px){main{grid-template-columns:1fr}header{flex-direction:column}#events{height:40vh}}
</style>
<header><div><h1>Workbench / 對話觀測台</h1><small>自然對話 · 串流回覆 · ROS 資料庫工具</small></div><div class="row"><span id="model"></span><span id="phase" class="badge">連線中</span></div></header>
<main><section class="panel"><div class="row"><h2>對話</h2><select id="actor"><option value="">未指定身分</option><option value="U_A">小安 U_A（手動）</option><option value="U_B">小林 U_B（手動）</option></select><button id="new">開始新對話</button></div><p class="help muted">保留近期最多 10 輪上下文，重啟後清空。切換身分請開新對話。此測試版只查詢，不搬動手臂或寫入資料庫。</p><div id="messages"></div><form id="form"><textarea id="text" rows="3" placeholder="例如：我的筆在哪裡？ → 那它的預設位置呢？" maxlength="2000" required></textarea><div class="row"><button id="send" class="primary">送出</button><label><input type="checkbox" id="think">啟用模型思考（較慢）</label><span id="service" class="muted"></span></div></form><p id="evidence" class="help muted"></p><p id="error" class="error"></p><details><summary>模型 thinking 輸出</summary><p class="help muted">只顯示模型 API 實際傳回的 thinking；不代表工具已執行。未回傳時保持空白。</p><pre id="thinking"></pre></details></section><section class="panel"><h2>即時 API 時序</h2><p class="help muted">model_start → 模型串流 → tool_start → Service 回覆 → 模型回答。展開可查看參數、結果、錯誤及耗時。</p><div id="events"></div></section></main>
<script>
let sid=sessionStorage.getItem('workbench-chat-session'),lastEvents='',lastTurns='',busy=false;
const $=id=>document.getElementById(id);
async function api(path,data){const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error);return j}
async function fresh(){try{const r=await api('/api/session',{user_id:$('actor').value});sid=r.session_id;sessionStorage.setItem('workbench-chat-session',sid);lastEvents='';lastTurns='';$('error').textContent=''}catch(e){$('error').textContent=e.message}}
$('new').onclick=fresh;
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;try{await api('/api/chat',{session_id:sid,text:$('text').value,think:$('think').checked});$('text').value='';$('error').textContent='';busy=true;$('send').disabled=true}catch(e){$('error').textContent=e.message}};
$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit()}};
function render(s){busy=s.busy;$('send').disabled=busy;$('new').disabled=busy;$('actor').disabled=busy;$('model').textContent=s.model;$('phase').textContent=s.phase;$('service').textContent=s.service_ready?'Inventory 已連線':'Inventory 離線';if($('actor').dataset.session!==s.session_id){$('actor').value=s.actor;$('actor').dataset.session=s.session_id;}
const current=s.turns.at(-1)?.turn_id;const queries=s.events.filter(e=>e.turn_id===current&&e.kind==='tool_end').length;$('evidence').textContent=current?'本輪成功查詢 '+queries+' 次'+(queries?'（可展開 tool_end 核對）':'；尚無本輪資料庫證據，可能是閒聊或沿用歷史。'):'';
const key=JSON.stringify(s.turns);if(key!==lastTurns){lastTurns=key;const box=$('messages'),near=box.scrollHeight-box.scrollTop-box.clientHeight<90;box.replaceChildren();for(const t of s.turns){for(const [cls,txt] of [['user','你：'+t.user],['assistant','助理：'+(t.content||'…')],['error',t.error]]){if(!txt)continue;const el=document.createElement('div');el.className='bubble '+cls;el.textContent=txt;box.append(el)}}if(near)box.scrollTop=box.scrollHeight;$('thinking').textContent=s.turns.at(-1)?.thinking||'此輪尚無 thinking 輸出';}
const ek=JSON.stringify(s.events);if(ek!==lastEvents){lastEvents=ek;const opened=new Set([...$('events').querySelectorAll('details[open]')].map(x=>x.dataset.seq));$('events').replaceChildren();for(const e of [...s.events].reverse()){const d=document.createElement('details');d.dataset.seq=e.seq;d.open=opened.has(String(e.seq));const title=document.createElement('summary');title.textContent=new Date(e.timestamp*1000).toLocaleTimeString()+' · '+e.kind+(e.api?' · '+e.api:'')+(e.duration_ms!==undefined?' · '+e.duration_ms+' ms':'');const p=document.createElement('pre');p.textContent=JSON.stringify(e,null,2);d.append(title,p);$('events').append(d)}}}
async function poll(){try{if(!sid)await fresh();if(sid)render(await api('/api/state?session_id='+encodeURIComponent(sid)))}catch(e){$('error').textContent=e.message;$('phase').textContent='連線失敗'}finally{setTimeout(poll,350)}}poll();
</script></html>
